<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Diamond Nutrition Scanner</title>

  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

  <style>
    body {
      margin: 0;
      padding: 20px;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    h1 {
      margin-bottom: 5px;
    }

    p {
      color: #bbb;
    }

    #reader {
      width: 100%;
      max-width: 500px;
      margin: 20px auto;
      background: white;
      border-radius: 15px;
      overflow: hidden;
    }

    button {
      width: 100%;
      max-width: 400px;
      padding: 16px;
      margin: 10px auto;
      border: none;
      border-radius: 12px;
      font-size: 18px;
      font-weight: bold;
    }

    #startBtn {
      background: #00c853;
      color: white;
    }

    #stopBtn {
      background: #d50000;
      color: white;
    }

    #status {
      margin-top: 15px;
      padding: 15px;
      border-radius: 10px;
      background: #222;
    }
  </style>
</head>

<body>

  <h1>💎 DIAMOND NUTRITION</h1>
  <p>Mobile Barcode Scanner</p>

  <button id="startBtn" onclick="startScanner()">
    📷 SCAN BARCODE
  </button>

  <button id="stopBtn" onclick="stopScanner()">
    ⛔ STOP SCANNER
  </button>

  <div id="reader"></div>

  <div id="status">
    Scanner ready
  </div>


<script>

const POS_URL =
"https://script.google.com/macros/s/AKfycbzopr46Mgn5Zp4ZPAtO6TDS6mCODKPeyU3Eum9KTF8VhaN4AyOtYskbg65uk9tA_atZNQ/exec";

let scanner = null;
let scanning = false;
let alreadyScanned = false;

// ========================================
// IMMEDIATE SCAN BEEP
// ========================================

let audioContext = null;

function prepareSound() {

  try {

    const AudioContext =
      window.AudioContext ||
      window.webkitAudioContext;

    if (!AudioContext) return;

    if (!audioContext) {
      audioContext = new AudioContext();
    }

    if (audioContext.state === "suspended") {
      audioContext.resume();
    }

  } catch (e) {
    console.log("Audio prepare error:", e);
  }

}


function playScanBeep() {

  try {

    if (!audioContext) return;

    if (audioContext.state === "suspended") {
      audioContext.resume();
    }

    const oscillator =
      audioContext.createOscillator();

    const gain =
      audioContext.createGain();

    oscillator.connect(gain);
    gain.connect(audioContext.destination);

    // High clear barcode scanner beep
    oscillator.type = "sine";
    oscillator.frequency.setValueAtTime(
      1000,
      audioContext.currentTime
    );

    gain.gain.setValueAtTime(
      0.25,
      audioContext.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
      0.01,
      audioContext.currentTime + 0.12
    );

    oscillator.start(
      audioContext.currentTime
    );

    oscillator.stop(
      audioContext.currentTime + 0.12
    );

  } catch (e) {

    console.log("Beep error:", e);

  }

}


// ========================================
// START SCANNER
// ========================================

function startScanner() {

  if (scanning) return;

  // Prepare audio while this is still a
  // user button click
  prepareSound();

  alreadyScanned = false;

  document.getElementById("status").innerText =
    "📷 Opening camera...";

  scanner = new Html5Qrcode("reader");

  scanner.start(
    {
      facingMode: "environment"
    },
    {
      fps: 10,
      qrbox: {
        width: 300,
        height: 150
      }
    },

    function(decodedText) {

      if (alreadyScanned) return;

      alreadyScanned = true;

      // ==================================
      // 🔊 IMMEDIATE BEEP
      // ==================================

      playScanBeep();

      document.getElementById("status").innerText =
        "✅ Barcode: " + decodedText;

      // Stop scanner
      scanner.stop()
        .then(function() {

          scanning = false;

          // Small delay so beep is heard
          setTimeout(function() {

            // Send barcode back to Diamond Nutrition POS
            window.location.href =
              POS_URL +
              "?barcode=" +
              encodeURIComponent(decodedText);

          }, 180);

        })
        .catch(function(error) {

          // Even if scanner stop has an error,
          // wait briefly so beep can play

          setTimeout(function() {

            window.location.href =
              POS_URL +
              "?barcode=" +
              encodeURIComponent(decodedText);

          }, 180);

        });

    },

    function(errorMessage) {
      // Normal scanning errors ignored
    }

  ).then(function() {

    scanning = true;

    document.getElementById("status").innerText =
      "📷 Camera active — barcode scan karo";

  }).catch(function(error) {

    scanning = false;

    document.getElementById("status").innerText =
      "❌ Camera Error: " + error;

  });

}


// ========================================
// STOP SCANNER
// ========================================

function stopScanner() {

  if (!scanner || !scanning) {

    document.getElementById("status").innerText =
      "Scanner stopped.";

    return;
  }

  scanner.stop()
    .then(function() {

      scanning = false;

      document.getElementById("status").innerText =
        "Scanner stopped.";

    })
    .catch(function(error) {

      console.log(error);

      scanning = false;

      document.getElementById("status").innerText =
        "Scanner stopped.";

    });

}

</script>

</body>
</html>
